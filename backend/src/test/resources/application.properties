spring.application.name=task-manager-backend-test

# Test JWT Secret (at least 256 bits)
jwt.secret=dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktdGhhdC1zaG91bGQtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==

# Disable Flyway during unit/JPA tests
spring.flyway.enabled=false

# Disable data.sql script init during tests (schema managed by Hibernate ddl-auto)
spring.sql.init.mode=never

# H2 In-Memory DB configuration for test profile
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
